[project]
name = "mini-agent"
version = "0.1.0"
description = "手写的教学版 ReAct Agent（无框架）"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# E/F/W: 基本错误与警告  I: import 排序  B: 常见 bug 检测（bugbear）
select = ["E", "F", "W", "I", "B"]
